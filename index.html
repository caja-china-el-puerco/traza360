<style>
/* Paleta tomada del logo (llama roja-naranja-amarilla, negro) y del tono crema/dorado de la referencia */
:root{color-scheme:light;--bg:#fcf9f2;--p1:#ffffff;--p2:#f6ead0;--line:#e6d9ba;--tx:#2a2318;--mu:#75684f;--gold:#8b6514;--gold2:#8b6514;--ok:#1d7a4b;--wa:#a65a05;--bad:#c4281c;--f1:#fbbf24;--f2:#f58a1f;--f3:#e0361b;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0 0 8px;line-height:1.15;font-family:Georgia,"Times New Roman",serif;color:var(--gold)}h2{font-size:20px}h3{font-size:17px}
.mu{color:var(--mu);font-size:13px}.r{text-align:right}.gold{color:var(--gold)}.bad{color:var(--bad)}.ok{color:var(--ok)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 14px 10px;background:rgba(252,249,242,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,var(--f1),var(--f2) 55%,var(--f3))}
.top .logo{width:44px;height:44px;object-fit:contain}.top .who{flex:1;min-width:0}.top .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:Georgia,serif;color:var(--gold)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);display:inline-block}.dot.off{background:var(--bad)}
.wrap{max-width:980px;margin:0 auto;padding:14px 14px 96px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);overflow-x:auto;box-shadow:0 -4px 14px rgba(120,90,20,.07)}
.nav button{flex:1 0 auto;min-width:76px;min-height:58px;background:none;border:0;color:var(--mu);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 10px}
.nav button span{font-size:20px}.nav button.on{color:var(--gold);font-weight:700;background:var(--p2);box-shadow:inset 0 3px 0 var(--f2)}
.btn{min-height:48px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer;color:var(--tx)}
.btn:active{transform:scale(.98)}.btn[disabled]{opacity:.45;pointer-events:none}
.btn.gold{background:linear-gradient(180deg,#a37a1a,#8b6514);color:#fff;border-color:#6f500f;text-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.bad{background:#fdeceb;border-color:#f0b4af;color:#a8231a}.btn.ghost{background:none}.btn.sm{min-height:40px;padding:6px 12px;font-size:14px}
.btn.big{min-height:72px;font-size:20px;width:100%;border-radius:16px;font-family:Georgia,serif}
.card{background:var(--p1);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px;box-shadow:0 1px 3px rgba(120,90,20,.07)}
.card.pri{border-color:var(--f2);box-shadow:inset 4px 0 0 var(--f2),0 1px 3px rgba(120,90,20,.07)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}.grow{flex:1}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--p2);border:1px solid var(--line);border-radius:var(--r);padding:12px;color:var(--gold)}.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums;font-family:Georgia,serif}.kpi .mu{color:var(--mu)}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--p2);border:1px solid var(--line);white-space:nowrap;color:var(--tx)}
.chip.g{border-color:#d9b25a;background:#fbf0d2;color:#6f500f}.chip.ok{border-color:#9fd3b5;background:#e8f6ee;color:var(--ok)}.chip.wa{border-color:#f0c58a;background:#fff1dc;color:#9a5200}.chip.bad{border-color:#f0b4af;background:#fdeceb;color:var(--bad)}
.f{display:block;margin:0 0 12px}.f>span{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;min-height:48px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:12px}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--f2);border-color:var(--f2)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.seg button{flex:1 0 auto}.seg .btn.on{background:var(--gold);color:#fff;border-color:#6f500f}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th{color:var(--mu);font-weight:500;text-align:left;border-bottom:1px solid var(--line);padding:6px 4px}.tbl td{padding:8px 4px;border-bottom:1px solid #efe5cc;vertical-align:top}.tbl .n{text-align:right;font-variant-numeric:tabular-nums}
.kan{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}.kan>div{flex:0 0 250px;scroll-snap-align:start;background:#f8f0dc;border:1px solid var(--line);border-radius:var(--r);padding:8px}
.kan h3{display:flex;justify-content:space-between}.kan .card{padding:10px;margin-bottom:8px;cursor:pointer}
.sem{font-size:14px}.banner{padding:10px 12px;border-radius:12px;margin-bottom:12px;background:#fff4d6;border:1px solid #e8c76a;color:#6f500f}.banner.bad{background:#fdeceb;border-color:#f0b4af;color:#a8231a}
.ov{position:fixed;inset:0;z-index:50;background:rgba(42,35,24,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(60,40,0,.25)}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:20px}}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:70;max-width:92vw;padding:12px 16px;border-radius:12px;background:#2a2318;color:#fff;border:1px solid var(--f2);box-shadow:0 8px 30px rgba(60,40,0,.35)}
.toast.bad{border-color:#ff8a80;background:#7f1d14}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:340px;margin:12px auto}
.pad button{min-height:68px;font-size:28px;border-radius:16px;border:1px solid var(--line);background:#fff;font-weight:600;box-shadow:0 1px 2px rgba(120,90,20,.1)}
.pad button:active{background:var(--gold);color:#fff}.pins{display:flex;gap:12px;justify-content:center;margin:10px 0}
.pins i{width:20px;height:20px;border-radius:50%;border:2px solid var(--gold)}.pins i.f{background:linear-gradient(180deg,var(--f2),var(--f3));border-color:var(--f3)}
.login{max-width:420px;margin:0 auto;padding:22px 16px 40px;text-align:center;background:radial-gradient(ellipse 80% 38% at 50% 0,#ffefc9 0,rgba(252,249,242,0) 100%)}.login .logo{width:170px;height:170px;object-fit:contain}
.login h1{font-size:30px;letter-spacing:1px}
.sig{width:100%;height:170px;background:#fff;border:1px solid var(--line);border-radius:12px;touch-action:none;display:block}
.thumb{max-width:100%;max-height:200px;border-radius:12px;border:1px solid var(--line);display:block;margin-top:8px}
.work{display:grid;gap:4px;margin:8px 0;padding:8px 10px;background:var(--p2);border-radius:10px;font-size:14px}
.chk{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px;background:var(--p2);border-radius:12px;margin-bottom:8px;font-size:18px}
.chk input{width:28px;height:28px;accent-color:var(--gold)}
pre.code{max-height:55vh;overflow:auto;background:#fffdf7;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:11px;white-space:pre}
.sp-top{height:6px}
.lin{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:14px}.lin.tot{border-top:1px dashed var(--line);margin-top:4px;padding-top:6px;font-weight:700}
</style>
