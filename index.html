<script>
(() => {
"use strict";
/* TRAZA360 · cliente "tonto": TODO dato operativo vive en RAM y se pierde al cerrar la pestaña.
   Esta función autoejecutable NO expone nada en window. La seguridad real está en Code.gs. */
const $app = document.getElementById("app");
const TZ = "America/Lima";
const S = { sess: null, user: null, st: null, ver: 0, skew: 0, tab: null, online: true, busy: false, modals: 0, editing: false,
  pending: false, draft: {}, rids: {}, idleEnd: 0, ttlMs: 0, lastPing: 0, ck: null, msg: "", timers: [], debePin: false };
const V = {};   // vistas por rol, se registran más abajo

/* ---------- utilidades DOM (todo texto entra por createTextNode: sin XSS) ---------- */
const fill = (el, ...kids) => { el.replaceChildren(); add(el, kids); return el; };   // replaceChildren() convertiría false/arrays en texto
const BU = () => String(BACKEND_URL).trim().replace(/^[\s"'`]+|[\s"'`]+$/g, "");
const add = (e, kids) => { for (const k of kids.flat(Infinity)) { if (k == null || k === false) continue; e.append(k.nodeType ? k : document.createTextNode(String(k))); } };
const h = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k]; if (v == null || v === false) continue;
    if (k === "class") e.className = v; else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v;
    else if (k === "checked" || k === "disabled") e[k] = !!v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  add(e, kids); return e;
};
const guard = fn => async ev => { const b = ev.currentTarget; if (b.disabled) return; b.disabled = true; try { await fn(ev); } finally { if (b.isConnected) b.disabled = false; } };
const money = n => "S/ " + Number(n || 0).toLocaleString("es-PE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nowMs = () => Date.now() + S.skew;
const hoursSince = iso => (nowMs() - Date.parse(iso)) / 3.6e6;
const fdate = iso => { const t = Date.parse(iso); return isNaN(t) ? "—" : new Date(t).toLocaleString("es-PE", { timeZone: TZ, day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }); };
const age = iso => { const x = hoursSince(iso); return x < 1 ? Math.max(1, Math.round(x * 60)) + " min" : x < 48 ? Math.floor(x) + " h" : Math.floor(x / 24) + " d"; };
const SVG_LOGO = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6dc8a"/><stop offset="1" stop-color="#c8921a"/></linearGradient></defs><g transform="rotate(-38 50 58)"><rect x="40" y="12" width="20" height="26" rx="4" fill="url(#g)"/><rect x="47" y="38" width="6" height="52" rx="3" fill="url(#g)"/></g><g transform="rotate(38 50 58)"><rect x="40" y="12" width="20" height="26" rx="4" fill="url(#g)"/><rect x="47" y="38" width="6" height="52" rx="3" fill="url(#g)"/></g><path d="M50 14C59 28 72 37 72 55C72 70 62 80 50 80C38 80 28 70 28 55C28 44 35 37 40 29C41 37 45 40 48 41C46 32 46 23 50 14Z" fill="url(#g)" stroke="#0b0b0c" stroke-width="3"/><path d="M50 46C56 53 61 57 61 64C61 71 56 75 50 75C44 75 39 71 39 64C39 58 44 54 50 46Z" fill="#0b0b0c"/></svg>';
const logo = cls => { const n = document.importNode(new DOMParser().parseFromString(SVG_LOGO, "image/svg+xml").documentElement, true); n.setAttribute("class", cls || "logo"); return n; };

/* ---------- avisos y ventanas ---------- */
let toastEl = null, toastT = 0;
function toast(msg, bad) {
  if (toastEl) toastEl.remove(); clearTimeout(toastT);
  toastEl = h("div", { class: "toast" + (bad ? " bad" : ""), role: "status" }, msg); document.body.append(toastEl);
  toastT = setTimeout(() => toastEl && toastEl.remove(), bad ? 6500 : 3500);
}
function modal(title, body, opt = {}) {
  const ov = h("div", { class: "ov", role: "dialog", "aria-modal": "true" });
  const close = () => { if (!ov.isConnected) return; ov.remove(); S.modals--; if (opt.onClose) opt.onClose(); if (S.modals === 0 && S.pending) render(); };
  ov.addEventListener("pointerdown", e => { if (e.target === ov && !opt.sticky) close(); });
  ov.append(h("div", { class: "sheet" }, h("div", { class: "row sp" }, h("h2", null, title), h("button", { class: "btn sm ghost", onclick: close, "aria-label": "Cerrar" }, "✕")), body));
  S.modals++; document.body.append(ov);
  return { close, el: ov };
}
const confirmBox = (msg, ok = "Confirmar") => new Promise(res => {
  let done = false; const fin = v => { if (!done) { done = true; res(v); m.close(); } };
  const m = modal("Confirmar", h("div", null, h("p", null, msg), h("div", { class: "row" }, h("button", { class: "btn gold grow", onclick: () => fin(true) }, ok), h("button", { class: "btn grow", onclick: () => fin(false) }, "Cancelar"))), { onClose: () => fin(false) });
});

/* ---------- teclado numérico táctil ---------- */
const keypad = onKey => h("div", { class: "pad" }, ["1", "2", "3", "4", "5", "6", "7", "8", "9", "⌫", "0", "C"].map(k => h("button", { type: "button", "aria-label": k, onclick: () => onKey(k) }, k)));
const pinDots = (n, total = 4) => h("div", { class: "pins" }, Array.from({ length: total }, (_, i) => h("i", { class: i < n ? "f" : "" })));
function askPin(titulo) {
  return new Promise(res => {
    let v = "", done = false; const box = h("div");
    const fin = x => { if (!done) { done = true; res(x); m.close(); } };
    const draw = () => fill(box, h("p", { class: "mu" }, "Ingrese su PIN de 4 dígitos para confirmar."), pinDots(v.length), keypad(k => {
      if (k === "⌫") v = v.slice(0, -1); else if (k === "C") v = ""; else if (v.length < 4) v += k;
      if (v.length === 4) return fin(v); draw();
    }));
    draw(); const m = modal(titulo, box, { sticky: true, onClose: () => fin(null) });
  });
}

/* ---------- formularios con borrador en RAM (el sondeo no borra lo que se escribe) ---------- */
const D = f => S.draft[f] || (S.draft[f] = {});
function inp(form, name, label, a = {}) {
  const d = D(form), el = h(a.tag || "input", { type: a.type || "text", inputmode: a.inputmode, maxlength: a.maxlength, placeholder: a.placeholder, autocomplete: "off", min: a.min, step: a.step, rows: a.rows });
  el.value = d[name] ?? a.def ?? ""; if (d[name] === undefined && a.def !== undefined) d[name] = a.def;
  el.addEventListener("input", () => { d[name] = el.value; if (a.on) a.on(el.value); });
  return h("label", { class: "f" }, h("span", null, label), el);
}
function sel(form, name, label, opts, a = {}) {
  const d = D(form), el = h("select", null, opts.map(([v, t]) => h("option", { value: v }, t)));
  el.value = d[name] ?? a.def ?? (opts[0] ? opts[0][0] : ""); d[name] = el.value;
  el.addEventListener("change", () => { d[name] = el.value; if (a.on) a.on(el.value); });
  return h("label", { class: "f" }, h("span", null, label), el);
}
const ridFor = k => S.rids[k] || (S.rids[k] = rnd(8));

/* ---------- foto (se comprime a ~150 KB en el celular) y firma ---------- */
async function comprimir(file) {
  const bmp = await createImageBitmap(file); let lado = 1000, q = 0.72, out = "";
  for (let i = 0; i < 8; i++) {
    const k = Math.min(1, lado / Math.max(bmp.width, bmp.height)), c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    out = c.toDataURL("image/jpeg", q);
    if (out.length * 0.75 <= 150 * 1024) break;
    q = Math.max(0.4, q - 0.08); lado = Math.round(lado * 0.85);
  }
  return out;
}
function fotoField(label) {
  let data = ""; const img = h("img", { class: "thumb", alt: "vista previa", style: "display:none" }), info = h("div", { class: "mu" });
  const inpf = h("input", { type: "file", accept: "image/*", capture: "environment", style: "display:none", onchange: async e => {
    const f = e.target.files[0]; if (!f) return;
    try { data = await comprimir(f); img.src = data; img.style.display = "block"; info.textContent = "Foto lista · " + Math.round(data.length * 0.75 / 1024) + " KB"; }
    catch (x) { toast("No se pudo leer la foto.", true); }
  } });
  return { el: h("div", { class: "f" }, h("button", { type: "button", class: "btn", onclick: () => inpf.click() }, "📷 " + label), inpf, img, info), get value() { return data; } };
}
function sigPad() {
  const c = h("canvas", { class: "sig", width: 600, height: 240 }), x = c.getContext("2d"); let dr = false, has = false;
  const clear = () => { x.fillStyle = "#fff"; x.fillRect(0, 0, 600, 240); x.strokeStyle = "#111"; x.lineWidth = 4; x.lineCap = "round"; has = false; }; clear();
  const pos = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * 600 / r.width, (e.clientY - r.top) * 240 / r.height]; };
  c.addEventListener("pointerdown", e => { dr = true; c.setPointerCapture(e.pointerId); const [a, b] = pos(e); x.beginPath(); x.moveTo(a, b); e.preventDefault(); });
  c.addEventListener("pointermove", e => { if (!dr) return; const [a, b] = pos(e); x.lineTo(a, b); x.stroke(); has = true; });
  ["pointerup", "pointercancel"].forEach(t => c.addEventListener(t, () => { dr = false; }));
  return { el: h("div", { class: "f" }, h("span", { class: "mu" }, "Firma del cliente (con el dedo)"), c, h("button", { type: "button", class: "btn sm ghost", onclick: clear }, "Borrar firma")), get empty() { return !has; }, data: () => c.toDataURL("image/png") };
}

/* ---------- criptografía y red ---------- */
const enc = new TextEncoder();
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
const rnd = n => hex(crypto.getRandomValues(new Uint8Array(n)));
const sha256 = async s => hex(await crypto.subtle.digest("SHA-256", enc.encode(s)));
async function hmac(msg) {
  if (!S.ck) S.ck = await crypto.subtle.importKey("raw", enc.encode(S.sess.k), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  return hex(await crypto.subtle.sign("HMAC", S.ck, enc.encode(msg)));
}
function deviceId() {   // identificador del equipo (no es un dato operativo); Gerencia debe autorizarlo
  try { let d = localStorage.getItem("t360.dev"); if (!/^[a-f0-9]{32}$/.test(d || "")) { d = rnd(16); localStorage.setItem("t360.dev", d); } return d; }
  catch (e) { return S.tmpDev || (S.tmpDev = rnd(16)); }
}
function setOnline(v) { if (S.online !== v) { S.online = v; const b = document.getElementById("net"); if (b) b.className = "dot" + (v ? "" : " off"); } }
async function calibrar() {
  try { const t0 = Date.now(), r = await fetch(BU(), { cache: "no-store" }), j = await r.json(); S.skew = j.t - (t0 + Date.now()) / 2; } catch (e) { /* sin ajuste */ }
}
async function api(a, payload = {}, retry = false) {
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(BU())) throw { code: "CONFIG", message: "La URL de la línea 18 no es válida. Debe empezar con https://script.google.com/ y terminar en /exec. Lo que hay ahora empieza con: «" + BU().slice(0, 45) + "»" };
  const p = JSON.stringify(payload), ts = Math.round(nowMs()), n = rnd(12), body = { a, ts, n, p };
  if (a !== "login") { body.t = S.sess.t; body.s = await hmac([a, body.t, ts, n, p].join("|")); }
  let j;
  try {
    const res = await fetch(BU(), { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body), cache: "no-store" });
    j = await res.json();
  } catch (e) { setOnline(false); throw { code: "RED", message: "Sin conexión con el servidor. No se guardó nada." }; }
  setOnline(true);
  if (!j.ok) {
    if (j.code === "TIEMPO" && !retry) { await calibrar(); return api(a, payload, true); }
    if ((j.code === "SESION" || j.code === "FIRMA") && S.sess) expulsar(j.message);
    throw j;
  }
  return j;
}
async function act(a, payload, opt = {}) {
  if (S.busy) return null; S.busy = true;
  try {
    if (opt.rid) payload.rid = ridFor(opt.rid);
    const j = await api(a, payload);
    if (opt.rid) delete S.rids[opt.rid];
    toast(j.message || "Listo"); await sync(true); return j;
  } catch (e) { if (opt.onError && opt.onError(e)) return null; toast(e.message || "Error inesperado", true); return null; }
  finally { S.busy = false; }
}

/* ---------- sesión, inactividad y sondeo ---------- */
function limpiarTimers() { S.timers.forEach(clearInterval); S.timers = []; }
function expulsar(msg) {
  limpiarTimers(); S.sess = null; S.user = null; S.st = null; S.ver = 0; S.ck = null; S.draft = {}; S.rids = {}; S.tab = null; S.msg = msg || "";
  document.querySelectorAll(".ov").forEach(o => o.remove()); S.modals = 0; S.editing = false; render();
}
function tocar() {
  if (!S.sess) return; S.idleEnd = Date.now() + S.ttlMs;
  if (Date.now() - S.lastPing > 20000) { S.lastPing = Date.now(); api("ping").catch(() => { }); }
}
async function sync(force) {
  if (!S.sess) return;

      msg && h("div", { class: "banner" + (pendiente ? "" : " bad") }, msg),

    if (step === 0 && code.length < 4) { code += k; if (code.length === 4) step = 1; return draw(); }
